[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-tutor-v2"
version = "0.1.0"
description = "A hybrid chess tutor: Gemini proposes moves with reasoning, Stockfish has the final say. Candidate-move comparison and plain-English coaching in a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chess Tutor" }]
dependencies = [
    "chess>=1.11.2",
    "openai>=3.25.0",
    "httpx2>=2.13.1",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
chess-tutor = "chess_tutor.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
