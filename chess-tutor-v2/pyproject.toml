[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-tutor-v2"
version = "0.1.0"
description = "A hybrid chess tutor: Gemini proposes moves with reasoning, Stockfish has the final say. Candidate-move comparison and plain-English coaching in a Pygame desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chess Tutor" }]
dependencies = [
    "chess>=1.11.2",
    "openai>=3.25.0",
    "websockets>=17.2",
    "python-dotenv>=1.2.4",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
chess-tutor-gui = "chess_tutor.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Exclude opt-in live network tests by default; run them with: pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: tests that hit the real chess-api.com service (requires network).",
]
